# Server
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/expense_tracker?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=your_username
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 🔥 JWT - FIXED SECRET
jwt.secret=MySuperSecretJWTKey12345678901234567890123456789012
jwt.expiration=86400000
jwt.header=Authorization
jwt.prefix=Bearer

# Logging
logging.level.com.expensetracker=DEBUG
logging.level.org.springframework.security=DEBUG
